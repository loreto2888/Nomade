# =============================================================================
# Nómade — Docker Compose de DESPLIEGUE (servidor Linux `dell-pc`, vía Cloudflare Tunnel, HTTPS)
# =============================================================================
# Primer despliegue (en dell-pc):
#   git clone <repo> nomade && cd nomade
#   cp .env.deploy.example .env && chmod 600 .env   # y cambiar TODOS los placeholders
#   docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
#
# Actualización (en dell-pc):
#   git pull
#   docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
#
# Orden de arranque: postgres (healthy) → migrations (exit 0) → backend (healthy) → web.
# Único puerto publicado: web ${WEB_PORT:-5178}; Cloudflare Tunnel apunta a él (D-16).
# Detalles, logs, respaldo y restauración: deploy/README.md
# =============================================================================
name: nomade

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: nomade
      NOMADE_OWNER_PASSWORD: ${NOMADE_OWNER_PASSWORD:?Define NOMADE_OWNER_PASSWORD en .env}
      NOMADE_APP_PASSWORD: ${NOMADE_APP_PASSWORD:?Define NOMADE_APP_PASSWORD en .env}
      TZ: ${TZ:-America/Santiago}
    # Sin puerto publicado. Para mantención desde el propio servidor, descomentar:
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    volumes:
      # PostgreSQL 18+: PGDATA=/var/lib/postgresql/18/docker; se monta el padre.
      - pgdata:/var/lib/postgresql
      - ./apps/migrations/docker/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d nomade"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  migrations:
    build:
      context: .
      dockerfile: apps/migrations/Dockerfile
    restart: "no"
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://nomade_owner:${NOMADE_OWNER_PASSWORD}@postgres:5432/nomade
      TZ: ${TZ:-America/Santiago}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "3007"
      DATABASE_URL: postgres://nomade_app:${NOMADE_APP_PASSWORD}@postgres:5432/nomade
      APP_ORIGIN: ${APP_ORIGIN:-https://nomade.coworlabs.cl}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Primer administrador: solo se usa si la tabla de usuarios está vacía.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Igual al ENV de la imagen; el directorio pertenece a `node` en la imagen,
      # así que el volumen nombrado (vacío) hereda ese dueño al crearse.
      ADJUNTOS_DIR: /data/adjuntos
      TZ: ${TZ:-America/Santiago}
    volumes:
      - adjuntos:/data/adjuntos
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3007/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${WEB_PORT:-5178}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Respaldo diario: pg_dump -Fc de `nomade` + tar.gz de adjuntos, con retención.
  # Va en el perfil por defecto (sin `profiles`) a propósito: el respaldo debe
  # quedar activo en cada `up -d` sin que nadie recuerde activarlo.
  backup:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: nomade
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      ADJUNTOS_SRC: /adjuntos
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - adjuntos:/adjuntos:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  adjuntos:
